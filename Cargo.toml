[package]
name = "disk-scavenger"
version = "0.1.0"
edition = "2024"
# eframe 0.37 (gui feature) sets the floor
rust-version = "1.95"
description = "Scan disk for bloat, offload to external drive, or clean up"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
same-file = "1"
rayon = "1"
sha2 = "0.10"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
trash = "4"
anyhow = "1"
ratatui = "0.28"
crossterm = "0.28"
# GUI frontend — optional so CLI builds never pull it in
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts"] }
# Native folder picker for the GUI
rfd = { version = "0.18.0", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
gui = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "disk-scavenger-app"
path = "src/gui/main.rs"
required-features = ["gui"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Byte counts become f64 only for display; precision loss there is fine
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
# `assert!(x.is_empty())` reads fine in tests
assert_is_empty = "allow"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
# unwind (not abort) so the TUI's terminal guard runs on panic
panic = "unwind"
